# version: '3.8' -- removed, obsolete in modern Docker Compose

services:
  # The Brain: Database + Vector Store
  db:
    image: pgvector/pgvector:pg17
    container_name: vibecheck_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: vibecheck_db
      POSTGRES_USER: lead_arch
      POSTGRES_PASSWORD: password123
    volumes:
      - vibecheck_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lead_arch -d vibecheck_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # The API: VibeCheck Node server
  server:
    build: ./server
    container_name: vibecheck_api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://lead_arch:password123@db:5432/vibecheck_db
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: mxbai-embed-large
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  # The Intelligence: Local LLM Inference
  ollama:
    image: ollama/ollama:latest
    container_name: vibecheck_ollama
    ports:
      - "11434:11434"
    volumes:
      - vibecheck_ollama_data:/root/.ollama

  # The Control Tower: Admin UI (Self-hosted Appsmith)
  appsmith:
    image: index.docker.io/appsmith/appsmith-ce
    container_name: vibecheck_admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./vibecheck-admin-stacks:/appsmith-stacks
    restart: unless-stopped

  # The Frontend: VibeCheck Next.js Web App
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Public env vars must be passed at BUILD TIME in Next.js
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-15551433589}
    container_name: vibecheck_web
    ports:
      - "3500:3500"
    environment:
      # Secret env vars are passed at RUNTIME (more secure)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3500}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  vibecheck_postgres_data:
  vibecheck_ollama_data:
