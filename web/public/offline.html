<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | VibeCheck</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F2F2F2;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 18px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: -0.05em;
      margin: 0 0 8px 0;
    }

    p {
      font-size: 11px;
      font-weight: 700;
      color: #71717A;
      max-width: 320px;
      margin: 0 0 32px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.5;
    }

    .btn {
      background-color: #000000;
      color: #FFFFFF;
      border: none;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 16px 32px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #27272A;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img src="/logo.png" alt="VibeCheck Logo" class="logo">
  </div>
  <h1>Connection Interrupted</h1>
  <p>You're offline. Reconnect to VibeCheck's exclusive network.</p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>

</html>
